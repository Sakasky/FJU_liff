<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>聖路加門診</title>
    <!-- 各路由標題由 router meta 設定；og 標籤供 LINE/社群分享預覽（爬蟲只讀靜態 HTML，全站共用一組） -->
    <meta property="og:site_name" content="聖路加門診" />
    <meta property="og:title" content="聖路加門診 LINE 服務" />
    <meta property="og:description" content="線上預約與基本資料填寫" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://fjuh.one/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <script type="text/javascript">
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
          if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
              return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
          }
      }(window.location))
      </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
